services:
  - type: web
    name: ai-study-assistant-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOW_ALL
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.6"
